
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Portal Login | Shree Suryodaya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="seal">SSSS</div>
      <div>
        <h1>School Portal</h1>
        <p>Shree Suryodaya Secondary School</p>
      </div>
    </div>
    <a class="btn light" href="index.html">← Home</a>
  </header>

  <main style="max-width:520px;margin:45px auto;padding:15px;">
    <section class="login-preview">
      <div class="login-heading">
        <span>🔐</span>
        <h2>Login to School Portal</h2>
        <p>Choose your preferred login method</p>
      </div>

      <button class="login-option google" id="google-login" type="button">
        🌐 Continue with Google
      </button>

      <button class="login-option facebook" id="facebook-login" type="button">
        f &nbsp; Continue with Facebook
      </button>

      <button class="login-option tiktok" id="tiktok-login" type="button">
        ♪ &nbsp; Continue with TikTok
      </button>

      <button class="login-option mobile" id="mobile-login" type="button">
        📱 Login with Mobile Number + OTP
      </button>

      <a class="login-option guest" href="index.html">
        👤 Continue as Guest
      </a>

      <p id="auth-message" class="login-note">
        Guest can view public information.
        Student records require an approved account.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const message = document.getElementById("auth-message");

    document.getElementById("google-login").onclick = async () => {
      try {
        await signInWithGoogle();
      } catch (error) {
        message.textContent = error.message;
      }
    };

    document.getElementById("facebook-login").onclick = async () => {
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: "facebook"
        });
        if (error) throw error;
      } catch (error) {
        message.textContent = error.message;
      }
    };

    document.getElementById("mobile-login").onclick = async () => {
      const phone = prompt("Enter your mobile number with country code (e.g. +97798XXXXXXXX):");
      if (!phone) return;

      try {
        const { error } = await supabaseClient.auth.signInWithOtp({
          phone: phone.trim()
        });
        if (error) throw error;

        const otp = prompt("Enter the OTP sent to your mobile:");
        if (!otp) return;

        const { error: verifyError } = await supabaseClient.auth.verifyOtp({
          phone: phone.trim(),
          token: otp.trim(),
          type: "sms"
        });
        if (verifyError) throw verifyError;

        window.location.href = "index.html";
      } catch (error) {
        message.textContent = error.message;
      }
    };

    document.getElementById("tiktok-login").onclick = () => {
      message.textContent =
        "TikTok login needs a separately configured OAuth provider. Setup is pending.";
    };
  </script>

</body>
</html>
